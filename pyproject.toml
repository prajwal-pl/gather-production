[project]
name = "gather"
version = "0.1.0"
description = "Meeting-to-task follow-up agent: connectors, canonical events, LangGraph workflows"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0",
    "keyring>=25.0.0",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.0",
]

[project.scripts]
gather = "gather.cli:main"
gather-engine = "gather.engine:main"

# Development / headless only. The desktop engine does not import these.
[dependency-groups]
dev = [
    "fastapi>=0.164.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
