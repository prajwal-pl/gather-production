[project]
name = "gather"
version = "0.1.0"
description = "Meeting-to-task follow-up agent: connectors, canonical events, LangGraph workflows"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.164.0",
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.22",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
